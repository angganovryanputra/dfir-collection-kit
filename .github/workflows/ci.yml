name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GO_VERSION: "1.23"
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend Lint & Security
  # ─────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 bandit safety

      - name: Run Black (format check)
        run: black --check --diff .

      - name: Run isort (import order check)
        run: isort --check --diff --profile black .

      - name: Run Flake8 (linting)
        # Existing modules intentionally use deferred imports for optional tools;
        # keep the gate focused on syntax/undefined names while the legacy style
        # debt is migrated incrementally.
        run: flake8 app tests --max-line-length=100 --extend-ignore=E202,E203,E402,E501,E712,E741,F401,F541,F841,W291,W293,W503

      - name: Run Bandit (security scan)
        run: bandit -r app/ -ll -ii

      - name: Run Safety (dependency vulnerability check)
        run: safety check -r requirements.txt --full-report
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend Tests
  # ─────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dfir
          POSTGRES_PASSWORD: dfir_test_password
          POSTGRES_DB: dfir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://dfir:dfir_test_password@localhost:5432/dfir_test
          SECRET_KEY: test-secret-key-not-for-production
          AGENT_SHARED_SECRET: test-agent-secret-not-for-production
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        env:
          DFIR_TEST_DATABASE_URL: postgresql+asyncpg://dfir:dfir_test_password@localhost:5432/dfir_test
          SECRET_KEY: test-secret-key-not-for-production
          AGENT_SHARED_SECRET: test-agent-secret-not-for-production
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Go Agent Lint & Test
  # ─────────────────────────────────────────────────────────────────────────────
  agent-lint-test:
    name: Go Agent Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('agent/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1.3.0
        with:
          version: "2024.1.1"
          install-go: false
          working-directory: agent

      - name: Run Go tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: agent/coverage.html

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend Lint & Build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker Build Test
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-lint, agent-lint-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: dfir-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: dfir-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test compose config
        env:
          SECRET_KEY: ci-compose-validation-key-not-for-deployment
          AGENT_SHARED_SECRET: ci-compose-validation-agent-not-for-deployment
          POSTGRES_PASSWORD: ci-compose-validation-password
          REDIS_PASSWORD: ci-compose-validation-redis
          DFIR_DEFAULT_ADMIN_PASSWORD: ci-compose-validation-admin
        run: docker compose config --quiet

  # ─────────────────────────────────────────────────────────────────────────────
  # Integration Test (Smoke Test)
  # ─────────────────────────────────────────────────────────────────────────────
  integration-smoke-test:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint-build, docker-build-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        run: |
          # Generate secrets for testing
          echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
          echo "AGENT_SHARED_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env
          echo "REDIS_PASSWORD=test_redis_pass" >> .env
          echo "DFIR_DEFAULT_ADMIN_PASSWORD=test_admin_pass" >> .env
          echo "SEED_DEMO_DATA=true" >> .env
          openssl req -x509 -newkey rsa:2048 -nodes -keyout nginx/certs/key.pem -out nginx/certs/cert.pem -days 1 -subj "/CN=localhost"
          echo "SSL_CERT_PATH=./nginx/certs/cert.pem" >> .env
          echo "SSL_KEY_PATH=./nginx/certs/key.pem" >> .env
          
          docker compose up -d --build
          
          # Wait for services to be healthy
          echo "Waiting for services to start..."
          sleep 60

      - name: Check service health
        run: |
          # Check backend health
          curl -k -f --silent --max-time 10 https://localhost/api/v1/status/health || exit 1
          echo "Backend is healthy"
          
          # Check frontend
          curl -k -f --silent --max-time 10 https://localhost/ || exit 1
          echo "Frontend is accessible"

      - name: Run API smoke tests
        run: |
          # Test login
          curl -f --silent --max-time 10 \
            -X POST https://localhost/api/v1/auth/login \
            -k \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"test_admin_pass"}' || exit 1
          echo "Login endpoint works"

      - name: Set up Node.js for browser workflow
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run Evidence Vault browser workflow
        working-directory: frontend
        env:
          E2E_ADMIN_PASSWORD: test_admin_pass
          E2E_BASE_URL: https://localhost
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium

      - name: Cleanup
        if: always()
        run: docker compose down -v
