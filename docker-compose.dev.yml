# Development-only override.  Keep the production compose file as the single
# source of truth for services, then layer this file on top for live reload.
#
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # The Vite development server is a separate browser origin.
      ALLOWED_ORIGINS: ${DEV_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend:/app
      - dfir_evidence:/vault/evidence
      - ./tools/eztools:/opt/eztools:ro
      - ./tools/hayabusa:/opt/hayabusa:ro
      - ./tools/chainsaw:/opt/chainsaw:ro
      - ./tools/yara-rules:/opt/yara-rules:ro
    command: >-
      /bin/sh -ec "alembic upgrade head && python app/seed_run.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"

  celery_worker:
    volumes:
      - ./backend:/app
      - dfir_evidence:/vault/evidence
      - ./tools/eztools:/opt/eztools:ro
      - ./tools/hayabusa:/opt/hayabusa:ro
      - ./tools/chainsaw:/opt/chainsaw:ro
      - ./tools/yara-rules:/opt/yara-rules:ro

  celery_beat:
    volumes:
      - ./backend:/app
      - dfir_evidence:/vault/evidence
      - dfir_celerybeat:/var/celery

  frontend:
    # Do not build the production Nginx image during development.  Vite serves
    # source files directly and provides HMR through a named node_modules volume.
    build: !reset null
    image: node:24-alpine
    container_name: dfir-frontend-dev
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - dfir_frontend_node_modules:/app/node_modules
    command: >-
      /bin/sh -ec "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi;
      npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # The browser talks to Vite and FastAPI directly in dev, so no certificate
  # or reverse proxy is required.  Production continues to start this service.
  nginx:
    profiles: ["production"]

volumes:
  dfir_frontend_node_modules:
