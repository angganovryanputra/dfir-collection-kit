[pytest]
asyncio_mode = auto
# Share one event loop across session-scoped async fixtures (engine) and tests —
# otherwise asyncpg connections bind to a different loop and every test errors.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Only collect the real suite under tests/. The repo root contains manual
# scratch scripts (integration_test.py, test_tl.py) that run container-only
# paths at import time and are not collectable pytest tests.
testpaths = tests
