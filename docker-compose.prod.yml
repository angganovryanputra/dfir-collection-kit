# DFIR Rapid Collection Kit — Production / Self-Hosted Prebuilt Stack
# Uses prebuilt multi-arch images from GitHub Container Registry (ghcr.io).
# No local compilation or build dependencies required.
#
# Quickstart:
#   docker compose -f docker-compose.prod.yml up -d
#
# With Auto-Update via Watchtower (zero-touch hot-reloading on image release):
#   docker compose -f docker-compose.prod.yml --profile auto-update up -d

services:
  # ── Volume permission init container ─────────────────────────────────────────
  init-volumes:
    image: busybox:1.36
    container_name: dfir-init-volumes
    user: "0:0"
    command:
      - sh
      - -ec
      - >-
        mkdir -p /vault/evidence /var/celery &&
        chown -R 1000:1000 /vault/evidence /var/celery &&
        chmod 0750 /vault/evidence /var/celery
    volumes:
      - dfir_evidence:/vault/evidence
      - dfir_celerybeat:/var/celery
    restart: "no"

  # ── FastAPI Application Backend ──────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/angganovryanputra/dfir-collection-kit-backend:latest}
    container_name: dfir-backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.25"
          memory: 512M
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dfir}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-dfir}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set. Run scripts/generate-secrets.sh}
      CHAIN_OF_CUSTODY_SIGNING_KEY: ${CHAIN_OF_CUSTODY_SIGNING_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      EVIDENCE_STORAGE_PATH: /vault/evidence
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?AGENT_SHARED_SECRET must be set. Run scripts/generate-secrets.sh}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      DFIR_DEFAULT_ADMIN_PASSWORD:   ${DFIR_DEFAULT_ADMIN_PASSWORD:?DFIR_DEFAULT_ADMIN_PASSWORD must be set}
      DFIR_DEFAULT_ANALYST_PASSWORD: ${DFIR_DEFAULT_ANALYST_PASSWORD:-}
      DFIR_DEFAULT_VIEWER_PASSWORD:  ${DFIR_DEFAULT_VIEWER_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
      EZTOOLS_DIR:      ${EZTOOLS_DIR:-/opt/eztools}
      HAYABUSA_PATH:    ${HAYABUSA_PATH:-/opt/hayabusa/hayabusa}
      CHAINSAW_PATH:    ${CHAINSAW_PATH:-/opt/chainsaw/chainsaw}
      SIGMA_RULES_DIR:  ${SIGMA_RULES_DIR:-/opt/chainsaw/rules/}
      CELERY_BROKER_URL:    redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set. Run scripts/generate-secrets.sh}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set. Run scripts/generate-secrets.sh}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set. Run scripts/generate-secrets.sh}@redis:6379/0
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-volumes:
        condition: service_completed_successfully
    volumes:
      - dfir_evidence:/vault/evidence
      - ./tools/yara-rules:/opt/yara-rules:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/status/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - dfir-network

  # ── Celery Forensics Pipeline Worker ─────────────────────────────────────────
  celery_worker:
    image: ${BACKEND_IMAGE:-ghcr.io/angganovryanputra/dfir-collection-kit-backend:latest}
    container_name: dfir-celery-worker
    command: celery -A app.worker.celery_app worker --loglevel=info --pool=prefork --concurrency=4 -Q default,forensics,periodic
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 1G
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dfir}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-dfir}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set. Run scripts/generate-secrets.sh}
      CHAIN_OF_CUSTODY_SIGNING_KEY: ${CHAIN_OF_CUSTODY_SIGNING_KEY:-}
      EVIDENCE_STORAGE_PATH: /vault/evidence
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?AGENT_SHARED_SECRET must be set}
      EZTOOLS_DIR:      ${EZTOOLS_DIR:-/opt/eztools}
      HAYABUSA_PATH:    ${HAYABUSA_PATH:-/opt/hayabusa/hayabusa}
      CHAINSAW_PATH:    ${CHAINSAW_PATH:-/opt/chainsaw/chainsaw}
      SIGMA_RULES_DIR:  ${SIGMA_RULES_DIR:-/opt/chainsaw/rules/}
      CELERY_BROKER_URL:    redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set. Run scripts/generate-secrets.sh}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set. Run scripts/generate-secrets.sh}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-volumes:
        condition: service_completed_successfully
    volumes:
      - dfir_evidence:/vault/evidence
      - ./tools/yara-rules:/opt/yara-rules:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - dfir-network

  # ── Celery Beat Scheduler ────────────────────────────────────────────────────
  celery_beat:
    image: ${BACKEND_IMAGE:-ghcr.io/angganovryanputra/dfir-collection-kit-backend:latest}
    container_name: dfir-celery-beat
    command: celery -A app.worker.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler --schedule=/var/celery/celerybeat-schedule
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dfir}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-dfir}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set. Run scripts/generate-secrets.sh}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?AGENT_SHARED_SECRET must be set}
      EVIDENCE_STORAGE_PATH: /vault/evidence
      CELERY_BROKER_URL:    redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set. Run scripts/generate-secrets.sh}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set. Run scripts/generate-secrets.sh}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-volumes:
        condition: service_completed_successfully
    volumes:
      - dfir_evidence:/vault/evidence
      - dfir_celerybeat:/var/celery
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/celery/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - dfir-network

  # ── React Frontend (SPA) ─────────────────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/angganovryanputra/dfir-collection-kit-frontend:latest}
    container_name: dfir-frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - dfir-network

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: dfir-postgres
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dfir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set. Run scripts/generate-secrets.sh}
      POSTGRES_DB: ${POSTGRES_DB:-dfir}
    volumes:
      - dfir_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dfir}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dfir-network

  # ── Redis (Celery Broker & Live Console Bus) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dfir-redis
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set. Run scripts/generate-secrets.sh}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - dfir_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dfir-network

  # ── HTTPS Reverse Proxy (Nginx) ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: dfir-nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - source: tls_cert
        target: tls_cert.pem
      - source: tls_key
        target: tls_key.pem
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dfir-network

  # ── Watchtower Auto-Updater (Optional Zero-Touch Background Auto-Update) ─────
  watchtower:
    image: containrrr/watchtower
    container_name: dfir-watchtower
    profiles:
      - auto-update
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=false
    restart: unless-stopped

networks:
  dfir-network:
    name: dfir-network
    driver: bridge

volumes:
  dfir_postgres:
    driver: local
  dfir_redis:
    driver: local
  dfir_evidence:
    driver: local
  dfir_celerybeat:
    driver: local

secrets:
  tls_cert:
    file: ./nginx/certs/server.crt
  tls_key:
    file: ./nginx/certs/server.key

